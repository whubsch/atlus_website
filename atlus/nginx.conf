server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Handle API requests by returning 404, allowing Traefik to handle them
  location ~* ^/(?:api/?[^.]*|docs|openapi\.json)$ {
    return 404;
  }

  # Handle all other requests with the React app
  location / {
    try_files $uri /index.html;
  }
}
