AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Atlus API - FastAPI application on AWS Lambda

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12
    Architectures:
      - x86_64
    Environment:
      Variables:
        PYTHONPATH: /var/task

Parameters:
  StageName:
    Type: String
    Default: prod
    Description: API Gateway stage name
    AllowedValues:
      - dev
      - staging
      - prod

  CustomDomainName:
    Type: String
    Default: ""
    Description: Custom domain name for the API (e.g., api.atlus.dev). Leave empty to skip custom domain setup.

  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN for the custom domain (must be in us-east-1). Leave empty to skip custom domain setup.

Conditions:
  UseCustomDomain: !Not [!Equals [!Ref CustomDomainName, ""]]

Resources:
  AtlusApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub atlus-api-${StageName}
      CodeUri: .
      Handler: lambda_handler.handler
      Description: Atlus API - Address and phone parsing service
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          STAGE: !Ref StageName
      Events:
        ApiRoot:
          Type: Api
          Properties:
            RestApiId: !Ref AtlusApiGateway
            Path: /
            Method: ANY
        ApiProxy:
          Type: Api
          Properties:
            RestApiId: !Ref AtlusApiGateway
            Path: /{proxy+}
            Method: ANY

  AtlusApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub atlus-api-${StageName}
      StageName: !Ref StageName
      Cors:
        AllowMethods: "'*'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"
        AllowCredentials: false

  ApiCustomDomain:
    Type: AWS::ApiGateway::DomainName
    Condition: UseCustomDomain
    Properties:
      DomainName: !Ref CustomDomainName
      CertificateArn: !Ref CertificateArn
      SecurityPolicy: TLS_1_2

  BasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: UseCustomDomain
    Properties:
      DomainName: !Ref CustomDomainName
      RestApiId: !Ref AtlusApiGateway
      Stage: !Ref StageName
    DependsOn:
      - ApiCustomDomain

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${AtlusApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/"
    Export:
      Name: !Sub atlus-api-url-${StageName}

  CustomDomainUrl:
    Description: Custom domain URL (if configured)
    Condition: UseCustomDomain
    Value: !Sub "https://${CustomDomainName}/"

  DistributionDomainName:
    Description: CloudFront distribution domain name for custom domain DNS setup
    Condition: UseCustomDomain
    Value: !GetAtt ApiCustomDomain.DistributionDomainName

  FunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt AtlusApiFunction.Arn
